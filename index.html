<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>GitHub Video Uploader & Converter</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f6f8fa; }
        .container { max-width: 550px; margin: 0 auto; border: 1px solid #d0d7de; padding: 25px; border-radius: 8px; background-color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; color: #24292f; border-bottom: 1px solid #d0d7de; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #57606a; font-size: 14px; }
        .form-group input[type="text"], .form-group input[type="password"] { width: 100%; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background-color: #2da44e; color: white; border: 1px solid rgba(27,31,36,0.15); padding: 12px 20px; cursor: pointer; border-radius: 6px; font-weight: 600; font-size: 14px; width: 100%; transition: 0.2s; }
        button:hover { background-color: #2c974b; }
        button:disabled { background-color: #94d3a2; cursor: not-allowed; }
        
        /* สไตล์ของกล่อง Log */
        .log-container { background-color: #1e1e1e; color: #00ff00; font-family: 'Courier New', Courier, monospace; padding: 15px; border-radius: 6px; margin-top: 15px; max-height: 15px; max-height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.5; }
        .log-entry { margin-bottom: 5px; }
        
        /* สไตล์ของปุ่มดาวน์โหลด */
        .download-box { margin-top: 20px; text-align: center; display: none; }
        .btn-download { background-color: #0969da; text-decoration: none; display: inline-block; text-align: center; width: calc(100% - 40px); }
        .btn-download:hover { background-color: #0c56b3; }
        hr { border: 0; border-top: 1px solid #d0d7de; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>GitHub Configuration</h2>
    <div class="form-group">
        <label for="githubUser">GitHub Username</label>
        <input type="text" id="githubUser" placeholder="เช่น knights-of-queen02">
    </div>
    <div class="form-group">
        <label for="githubRepo">Repository Name</label>
        <input type="text" id="githubRepo" placeholder="เช่น video-processor">
    </div>
    <div class="form-group">
        <label for="githubToken">Personal Access Token (Classic)</label>
        <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    </div>

    <hr>

    <h2>แปลงไฟล์วิดีโอผ่าน GitHub Cloud</h2>
    <div class="form-group">
        <label for="videoFile">เลือกไฟล์วิดีโอ (.MP4)</label>
        <input type="file" id="videoFile" accept="video/mp4">
    </div>
    
    <button id="submitBtn" onclick="uploadToGitHub()">อัปโหลดและแปลงไฟล์ทันที</button>
    
    <!-- กล่องแสดง Log สถานะ -->
    <div class="log-container" id="logContainer">
        <div class="log-entry">[System] สแตนด์บาย รอการอัปโหลดไฟล์...</div>
    </div>

    <!-- ปุ่มดาวน์โหลดที่จะโผล่มาตอนเสร็จ -->
    <div class="download-box" id="downloadBox">
        <a href="#" id="downloadLink" target="_blank" class="btn-download"><button type="button" style="background-color: #0969da;">📥 ดาวน์โหลดวิดีโอ Test1.MP4</button></a>
    </div>
</div>

<script>
const INPUT_PATH = "media/Test.MP4";
const OUTPUT_PATH = "media/Test1.MP4";
let checkInterval;

window.onload = function() {
    if (localStorage.getItem('git_user')) document.getElementById('githubUser').value = localStorage.getItem('git_user');
    if (localStorage.getItem('git_repo')) document.getElementById('githubRepo').value = localStorage.getItem('git_repo');
    if (localStorage.getItem('git_token')) document.getElementById('githubToken').value = localStorage.getItem('git_token');
};

function addLog(message) {
    const logContainer = document.getElementById('logContainer');
    const time = new Date().toLocaleTimeString();
    logContainer.innerHTML += `<div class="log-entry">[${time}] ${message}</div>`;
    logContainer.scrollTop = logContainer.scrollHeight; // เลื่อน Log ลงล่างสุดเสมอ
}

async function uploadToGitHub() {
    const OWNER = document.getElementById('githubUser').value.trim();
    const REPO = document.getElementById('githubRepo').value.trim();
    const TOKEN = document.getElementById('githubToken').value.trim();
    const fileInput = document.getElementById('videoFile');
    const submitBtn = document.getElementById('submitBtn');
    
    if (!OWNER || !REPO || !TOKEN || fileInput.files.length === 0) {
        alert('กรุณากรอกข้อมูลให้ครบถ้วนและเลือกไฟล์ก่อนครับ');
        return;
    }

    // ล็อคปุ่มและซ่อนปุ่มดาวน์โหลดเก่า (ถ้ามี)
    submitBtn.disabled = true;
    document.getElementById('downloadBox').style.display = "none";
    
    localStorage.setItem('git_user', OWNER);
    localStorage.setItem('git_repo', REPO);
    localStorage.setItem('git_token', TOKEN);

    const file = fileInput.files[0];
    addLog("กำลังแปลงไฟล์วิดีโอภายในเครื่องเป็น Base64...");

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = async function () {
        const base64Content = reader.result.split(',')[1];
        addLog("ตรวจสอบไฟล์เก่าบน GitHub เพื่อเตรียมเขียนทับ...");
        
        let sha = "";
        try {
            const getFileRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${INPUT_PATH}`, {
                headers: { 'Authorization': `token ${TOKEN}` }
            });
            if (getFileRes.ok) {
                const fileData = await getFileRes.json();
                sha = fileData.sha;
                addLog("พบไฟล์เก่า ค้นหาเลข SHA สำเร็จ");
            }
        } catch (err) { }

        addLog("กำลังส่งไฟล์ขึ้น GitHub (อาจใช้เวลาซักครู่ตามขนาดไฟล์)...");

        const uploadRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${INPUT_PATH}`, {
            method: 'PUT',
            headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: "Upload video via HTML Client", content: base64Content, sha: sha ? sha : undefined })
        });

        if (uploadRes.ok) {
            addLog("⚡ อัปโหลดสำเร็จ! ไฟล์ถูกเขียนทับเรียบร้อย");
            addLog("⏳ กำลังรอให้ GitHub Actions เริ่มทำงาน (ปกติใช้เวลาตื่น 5-10 วินาที)...");
            
            // รอ 8 วินาทีแล้วค่อยเริ่มตามส่องสถานะของ Workflow
            setTimeout(() => { startPollingStatus(OWNER, REPO, TOKEN); }, 8000);
        } else {
            addLog("❌ เกิดข้อผิดพลาดในการอัปโหลด กรุณาตรวจสอบสิทธิ์ของ Token");
            submitBtn.disabled = false;
        }
    };
}

// ฟังก์ชันคอยตามส่องสถานะของ GitHub Actions ทุกๆ 5 วินาที
function startPollingStatus(OWNER, REPO, TOKEN) {
    const submitBtn = document.getElementById('submitBtn');
    
    checkInterval = setInterval(async () => {
        try {
            // ดึงข้อมูลรายการรันล่าสุดของ GitHub Actions ใน Repo นี้
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs?per_page=1`, {
                headers: { 'Authorization': `token ${TOKEN}` }
            });
            
            if (res.ok) {
                const data = await res.json();
                if (data.workflow_runs.length === 0) return;
                
                const latestRun = data.workflow_runs[0];
                const status = latestRun.status;       // เช่น queued, in_progress, completed
                const conclusion = latestRun.conclusion; // เช่น success, failure, cancelled

                if (status === "queued") {
                    addLog("🔄 GitHub กำลังต่อคิวเปิดเครื่องเซิร์ฟเวอร์...");
                } else if (status === "in_progress") {
                    addLog("⚙️ กำลังประมวลผล: เซิร์ฟเวอร์กำลังรันคำสั่ง FFmpeg ลบไฟล์เก่าและแปลงไฟล์ใหม่...");
                } else if (status === "completed") {
                    clearInterval(checkInterval); // หยุดเช็กเพราะทำงานเสร็จแล้ว
                    submitBtn.disabled = false;   // ปลดล็อคปุ่มให้กดใหม่ได้
                    
                    if (conclusion === "success") {
                        addLog("✅ แปลงไฟล์สำเร็จ 100%! กำลังสร้างลิงก์ดาวน์โหลด...");
                        generateDownloadLink(OWNER, REPO, TOKEN);
                    } else {
                        addLog(`❌ GitHub Actions ทำงานล้มเหลว (Conclusion: ${conclusion}) ลองเช็กสคริปต์ .yml บนเรโพดูครับ`);
                    }
                }
            }
        } catch (error) {
            console.error("Error polling workflow status:", error);
        }
    }, 5000); // เช็กสถานะซ้ำทุกๆ 5 วินาที
}

// ฟังก์ชันดึงลิ้งก์ตรงของไฟล์ที่สร้างเสร็จแล้วมาทำปุ่มกดดาวน์โหลด
async function generateDownloadLink(OWNER, REPO, TOKEN) {
    try {
        // ใช้หัวข้อดึงข้อมูล Content เพื่อเอา download_url ด่วนที่สุดโดยไม่ติดแคชของเบราว์เซอร์
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${OUTPUT_PATH}?t=${new Date().getTime()}`, {
            headers: { 'Authorization': `token ${TOKEN}` }
        });
        
        if (res.ok) {
            const data = await res.json();
            const rawDownloadUrl = data.download_url; // ลิงก์ตรงดาวน์โหลดไฟล์ดิบจาก GitHub

            // แสดงบล็อกดาวน์โหลดและผูกลิงก์เข้าไปที่ปุ่ม
            const downloadBox = document.getElementById('downloadBox');
            const downloadLink = document.getElementById('downloadLink');
            
            downloadLink.href = rawDownloadUrl;
            downloadBox.style.display = "block";
            
            addLog("🎉 พร้อมดาวน์โหลดแล้ว! คลิกที่ปุ่มด้านล่างได้เลยครับ");
        } else {
            addLog("⚠️ แปลงไฟล์เสร็จแล้ว แต่ระบบยังหาไฟล์ Test1.MP4 ในเรโพไม่เจอ ลองกดรีเฟรชหน้าเว็บดูอีกครั้งครับ");
        }
    } catch (err) {
        addLog("❌ เกิดข้อผิดพลาดในการดึงลิงก์ดาวน์โหลด");
    }
}
</script>

</body>
</html>
